# PiPedal auto-hotspot DNS names for NetworkManager shared connections.
# Installed to /etc/NetworkManager/dnsmasq-shared.d/pipedal.conf
#
# iPad/iOS uses the DHCP DNS server for .local lookups while on the hotspot,
# so pipedal.local must resolve here (mDNS alone is not enough).
address=/pipedal.local/192.168.60.1
address=/pipedal/192.168.60.1
address=/raspberrypi.local/192.168.60.1
address=/raspberrypi/192.168.60.1
